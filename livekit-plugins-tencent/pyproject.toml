[project]
name = "livekit-plugins-tencent"
dynamic = ["version"]
description = "LiveKit Agents plugin for Tencent Cloud streaming TTS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LiveKit Tencent Plugin" }]
keywords = ["webrtc", "realtime", "audio", "livekit", "tencent", "tts"]
dependencies = [
    "aiohttp>=3.9.0",
    "livekit-agents>=1.0",
    "pydantic>=2.0",
]

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "livekit/plugins/tencent/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]
